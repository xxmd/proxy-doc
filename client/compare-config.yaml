    type: vless
    server: 47.86.26.23
    port: 443
    uuid: 367e8d69-3769-4355-857d-f2c48db57ecf
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.hkex.com.hk
    client-fingerprint: chrome
    reality-opts:
      public-key: pkRXGVRAllSNLATNBPMP7KuDe0ej5BsbsKrUEfXAM2k
      short-id: 95d78701bfdcb44b

  # ---------- 机场：SSRDOG 香港 01-05（AnyTLS）----------
