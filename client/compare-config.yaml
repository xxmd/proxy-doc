# ============================================================
#  节点质量对比测试配置
#  把「自建香港节点」和「机场香港节点」放进同一个 mihomo 实例，
#  便于逐个切换做同条件对比测量。
#
#  端口与 Clash Verge 隔离：mixed 7899 / API 9099
#  用法：D:\ClashVerge\verge-mihomo.exe -d <workdir> -f compare-config.yaml
# ============================================================
mixed-port: 7899
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: false          # 关掉，看未修饰的原始延迟
external-controller: 127.0.0.1:9099
secret: ''
dns:
  enable: false

proxies:
  # ---------- 自建：阿里云香港 REALITY ----------
