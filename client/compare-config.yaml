  - { name: 'SSRDOG-HK-02', type: anytls, server: y72zuz0pah.yn33dfs2.sbs, port: 602, password: fb8b71c6-e899-4d59-bd5b-c049a62549f3, udp: true, client-fingerprint: chrome, sni: down-30005.sz.gfp.tencent-cloud.com, skip-cert-verify: true }
  - { name: 'SSRDOG-HK-03', type: anytls, server: y72zuz0pah.yn33dfs2.sbs, port: 603, password: fb8b71c6-e899-4d59-bd5b-c049a62549f3, udp: true, client-fingerprint: chrome, sni: down-30005.sz.gfp.tencent-cloud.com, skip-cert-verify: true }
  - { name: 'SSRDOG-HK-04', type: anytls, server: y72zuz0pah.yn33dfs2.sbs, port: 604, password: fb8b71c6-e899-4d59-bd5b-c049a62549f3, udp: true, client-fingerprint: chrome, sni: down-30005.sz.gfp.tencent-cloud.com, skip-cert-verify: true }
